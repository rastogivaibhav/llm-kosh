name: Bug report
description: Report a reproducible problem in LLM-Kosh
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please remove credentials, private memory, customer data, and proprietary content before posting.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Provide the smallest safe command sequence or code example that reproduces the problem.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: LLM-Kosh version
      placeholder: "e.g. 2.1.3"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Python version, OS, MCP client if applicable"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized output or logs
      description: Include only output needed to diagnose the issue. Do not paste cartridge contents or secrets.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private conversations, customer data, proprietary documents, and other sensitive material.
          required: true
