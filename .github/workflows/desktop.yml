name: Build Desktop + CLI Binaries

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─── Python CLI binary (PyInstaller) per OS ───────────────────────────────
  cli-binary:
    name: CLI binary / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: llm-kosh-windows.exe
            dist_name: llm-kosh.exe
          - os: macos-latest
            artifact: llm-kosh-macos
            dist_name: llm-kosh
          - os: ubuntu-latest
            artifact: llm-kosh-linux
            dist_name: llm-kosh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools wheel pybind11
          pip install -e ".[server,watch,ingest]"
          pip install pyinstaller

      - name: Build binary (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller packaging/llm_kosh.spec --distpath sidecar/bin/win

      - name: Build binary (macOS)
        if: runner.os == 'macOS'
        run: pyinstaller packaging/llm_kosh.spec --distpath sidecar/bin/mac

      - name: Build binary (Linux)
        if: runner.os == 'Linux'
        run: pyinstaller packaging/llm_kosh.spec --distpath sidecar/bin/linux

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          copy sidecar\bin\win\llm-kosh.exe ${{ matrix.artifact }}
        shell: pwsh

      - name: Rename artifact (macOS/Linux)
        if: runner.os != 'Windows'
        run: cp sidecar/bin/*/llm-kosh ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}

  # ─── Electron desktop app per OS ──────────────────────────────────────────
  desktop:
    name: Desktop app / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: cli-binary
    strategy:
      matrix:
        include:
          - os: windows-latest
            build_cmd: "npm run package:win"
            artifact_glob: "desktop-app/dist-electron/*.exe"
            artifact_name: llm-kosh-desktop-windows.exe
          - os: macos-latest
            build_cmd: "npm run package:mac"
            artifact_glob: "desktop-app/dist-electron/*.dmg"
            artifact_name: llm-kosh-desktop-macos.dmg
          - os: ubuntu-latest
            build_cmd: "npm run package:linux"
            artifact_glob: "desktop-app/dist-electron/*.AppImage"
            artifact_name: llm-kosh-desktop-linux.AppImage

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Download the CLI binary built in the previous job
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.os == 'windows-latest' && 'llm-kosh-windows.exe' || matrix.os == 'macos-latest' && 'llm-kosh-macos' || 'llm-kosh-linux' }}
          path: sidecar-bin/

      - name: Stage sidecar (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path desktop-app/resources/bin
          Copy-Item sidecar-bin/llm-kosh-windows.exe desktop-app/resources/bin/llm-kosh.exe
        shell: pwsh

      - name: Stage sidecar (macOS/Linux)
        if: runner.os != 'Windows'
        run: |
          mkdir -p desktop-app/resources/bin
          cp sidecar-bin/llm-kosh-* desktop-app/resources/bin/llm-kosh
          chmod +x desktop-app/resources/bin/llm-kosh

      - name: Generate icons
        working-directory: desktop-app
        run: |
          npm ci
          node scripts/generate_icons.js ../llm-kosh-icon.PNG

      - name: Build desktop app
        working-directory: desktop-app
        run: ${{ matrix.build_cmd }}

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          $f = Get-ChildItem "desktop-app/dist-electron/*.exe" | Select-Object -First 1
          Copy-Item $f.FullName ${{ matrix.artifact_name }}
        shell: pwsh

      - name: Rename artifact (macOS/Linux)
        if: runner.os != 'Windows'
        run: cp ${{ matrix.artifact_glob }} ${{ matrix.artifact_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
