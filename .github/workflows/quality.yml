name: Quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install ruff pytest pytest-asyncio

      - name: Compile Python sources
        run: python -m compileall -q llm_kosh

      - name: Lint public verification and trusted-memory surfaces
        run: |
          ruff check \
            llm_kosh/verify \
            llm_kosh/runtime \
            llm_kosh/mcp_verify_server.py \
            examples/kosh_verify \
            scripts/kosh_verify_acceptance.py \
            scripts/trusted_memory_acceptance.py \
            tests/test_kosh_verify_mcp.py \
            tests/runtime \
            --select E9,F63,F7,F82

      - name: Run deterministic Kosh Verify acceptance checks
        run: python scripts/kosh_verify_acceptance.py

      - name: Run deterministic Trusted Memory Runtime acceptance checks
        run: python scripts/trusted_memory_acceptance.py

      - name: Run focused Kosh Verify MCP tests
        run: python -m pytest -q tests/test_kosh_verify_mcp.py

      - name: Run Trusted Memory Runtime contract tests
        run: python -m pytest -q tests/runtime

      - name: Validate installed dependency graph
        run: python -m pip check
