[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-kosh"
version = "2.0.0"
description = "Local-first AI memory cartridge system"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Vaibhav Rastogi", email = "vrastogi@example.com" }
]
dependencies = [
    # LlmKosh relies heavily on the standard library for its core
]

[project.optional-dependencies]
watch = [
    "watchdog>=3.0.0"
]
semantic = [
    "sentence-transformers>=2.2.0"
]
server = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "mcp>=1.0.0"
]
all = [
    "llm-kosh[watch,semantic,server]"
]

[project.scripts]
llm-kosh = "llm_kosh.cli:main"

[tool.setuptools]
packages = ["llm_kosh"]
